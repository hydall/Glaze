name: Release article (site, Discord, Telegram)

# After a release is published from `main`, writes its changelog article on the
# site, deploys the site, and posts the release to the Discord channel (in
# English) and the Telegram channel (in Russian):
#
#   **Glaze** `26.11.1`
#
#   DOWNLOAD / СКАЧАТЬ                          → the site's download page
#
#   RELEASE NOTES / СТАТЬЯ С ОПИСАНИЕМ РЕЛИЗА   → the article (its preview card shows)
#
#   This release was made automatically… / Релиз был сделан автоматически…
#   (only for releases made by auto-release.yml)
#
# - The article (Russian + English), the roadmap entry and the link-preview
#   cover are written by .github/scripts/release_article.py, which asks the
#   same DeepSeek model the bug-triage bot uses, from the PRs in the release.
# - The result is committed straight to `main` and the Pages workflow is
#   dispatched: a push made with the workflow token does not start other
#   workflows on its own. The post goes out only once the deploy has finished,
#   so the links and the preview card are already live.
# - Runs once per release: when the article already exists it is not written
#   again. A manual run can post an existing release again.
#
# Started by auto-release.yml for its own releases, and by the workflow_run
# trigger below for a release built by hand from main.
#
# Secrets / variables:
#   DEEPSEEK_API_KEY (secret), DEEPSEEK_MODEL, DEEPSEEK_BASE_URL (vars, optional)
#   TG_BOT_TOKEN (secret, shared with the build posts)
#   TG_RELEASE_CHAT_ID (secret): the Telegram channel, @username or -100… id;
#     the bot must be an admin there. TG_RELEASE_TOPIC_ID only for a forum group.
#   DISCORD_RELEASE_WEBHOOK (secret): webhook URL of the Discord channel.
#   A target whose secret is unset is skipped with a warning.
#
# workflow_run workflows run from the default branch, so this file has to be on
# `main`.

on:
  workflow_run:
    workflows: ["Build Release (Publish)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v26.11.1 (empty = the latest stable release)"
        required: false
        default: ""
        type: string
      post:
        description: "Post the release to the Discord and Telegram channels"
        required: false
        default: true
        type: boolean
      auto:
        description: "Made by auto-release (adds the 'released automatically' line)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-article
  cancel-in-progress: false

jobs:
  article:
    # Only releases built from main; pre-releases get no article. Builds that
    # auto-release.yml started are skipped here: it starts this workflow
    # itself, with the `auto` line, once its build is done.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.triggering_actor.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the release
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # Stable releases, newest first.
          mapfile -t tags < <(gh release list --exclude-pre-releases --exclude-drafts \
            --limit 30 --json tagName --jq '.[].tagName')

          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ -n "${HEAD_SHA:-}" ]; then
            # The release the finished build run just published: its tag
            # points at the commit that run built.
            for t in "${tags[@]}"; do
              if [ "$(git rev-list -n 1 "$t" 2>/dev/null)" = "$HEAD_SHA" ]; then tag="$t"; break; fi
            done
          elif [ -z "$tag" ]; then
            tag="${tags[0]:-}"
          fi

          if [ -z "$tag" ] || ! printf '%s\n' "${tags[@]}" | grep -qx "$tag"; then
            echo "No stable release for this run (a pre-release, or the tag is not a published release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The previous stable release bounds the change list.
          prev=""
          for i in "${!tags[@]}"; do
            if [ "${tags[$i]}" = "$tag" ]; then prev="${tags[$((i + 1))]:-}"; break; fi
          done

          version="${tag#v}"
          date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt[:10]')
          gh release view "$tag" --json assets --jq '[.assets[] | {name, size}]' > "$RUNNER_TEMP/assets.json"

          exists=false
          [ -f "site/articles/$version.ru.md" ] && exists=true

          echo "Release $tag (previous: ${prev:-none}), published $date, article exists: $exists"
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "prev=$prev"
            echo "version=$version"
            echo "date=$date"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      - name: Write the article
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.exists == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          CHROME: google-chrome
        run: |
          python3 .github/scripts/release_article.py \
            --version "${{ steps.rel.outputs.version }}" \
            --tag "${{ steps.rel.outputs.tag }}" \
            --prev-tag "${{ steps.rel.outputs.prev }}" \
            --date "${{ steps.rel.outputs.date }}" \
            --assets "$RUNNER_TEMP/assets.json" \
            --announce-out "$RUNNER_TEMP/announce.json"

      - name: Commit to main
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -q -m "feat(site): add the ${{ steps.rel.outputs.version }} article" \
            -m "Written by .github/workflows/release-article.yml for ${{ steps.rel.outputs.tag }}."
          # main may have moved while the model was writing.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --quiet origin main
          done
          echo "::error::Could not push the article to main."
          exit 1

      - name: Deploy the site
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.exists == 'false'
        run: |
          set -euo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --workflow pages.yml --branch main --event workflow_dispatch \
              --limit 5 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")][0].databaseId // empty")
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::The Pages deploy did not start."
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 20 > /dev/null

      - name: Post
        if: >-
          steps.rel.outputs.skip == 'false' &&
          ((github.event_name == 'workflow_run' && steps.rel.outputs.exists == 'false') ||
           (github.event_name == 'workflow_dispatch' && inputs.post))
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          AUTO: ${{ inputs.auto || false }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_RELEASE_CHAT_ID }}
          TG_TOPIC: ${{ secrets.TG_RELEASE_TOPIC_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: bash .github/scripts/post_release.sh
