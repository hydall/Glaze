name: Release article (site, Discord, Telegram)

# After a release is published from `main`, writes its changelog article on the
# site, deploys the site, and posts the article's link to Discord and Telegram.
#
# - The article (Russian + English), the roadmap entry and the link-preview
#   cover are written by .github/scripts/release_article.py, which asks the
#   same DeepSeek model the bug-triage bot uses, from the PRs in the release.
# - The result is committed straight to `main` (the site lives only there) and
#   the Pages workflow is dispatched: a push made with the workflow token does
#   not start other workflows on its own. The link is posted only once the
#   deploy has finished, so its preview card is already live.
# - Runs once per release: when the article already exists it is not written
#   again. A manual run can re-post the link of an existing article.
#
# Secrets / variables:
#   DEEPSEEK_API_KEY (secret), DEEPSEEK_MODEL, DEEPSEEK_BASE_URL (vars, optional)
#   TG_BOT_TOKEN, TG_CHAT_ID, TG_TOPIC_ID (secrets, shared with the build posts)
#   DISCORD_RELEASE_WEBHOOK (secret): webhook URL of the Discord channel the
#     link goes to. Unset = Discord is skipped with a warning.
#   RELEASE_POST_LANG (var): ru (default), en or both — language of the posts.
#
# Off by default: after a release nothing happens until the repository
# variable RELEASE_ARTICLE_AUTO is `true`. A manual run (Actions → this
# workflow → Run workflow) works either way, with or without posting.
#
# workflow_run workflows run from the default branch, so this file has to be on
# `main`.

on:
  workflow_run:
    workflows: ["Build Release (Publish)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v26.11.1 (empty = the latest stable release)"
        required: false
        default: ""
        type: string
      post:
        description: "Post the article's link to Discord and Telegram"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-article
  cancel-in-progress: false

jobs:
  article:
    # Only releases built from main; pre-releases from nightly get no article.
    # The automatic run is off until the repository variable
    # RELEASE_ARTICLE_AUTO is set to `true`; a manual run always works.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.RELEASE_ARTICLE_AUTO == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the release
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # Stable releases, newest first.
          mapfile -t tags < <(gh release list --exclude-pre-releases --exclude-drafts \
            --limit 30 --json tagName --jq '.[].tagName')

          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ -n "${HEAD_SHA:-}" ]; then
            # The release the finished build run just published: its tag
            # points at the commit that run built.
            for t in "${tags[@]}"; do
              if [ "$(git rev-list -n 1 "$t" 2>/dev/null)" = "$HEAD_SHA" ]; then tag="$t"; break; fi
            done
          elif [ -z "$tag" ]; then
            tag="${tags[0]:-}"
          fi

          if [ -z "$tag" ] || ! printf '%s\n' "${tags[@]}" | grep -qx "$tag"; then
            echo "No stable release for this run (a pre-release, or the tag is not a published release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The previous stable release bounds the change list.
          prev=""
          for i in "${!tags[@]}"; do
            if [ "${tags[$i]}" = "$tag" ]; then prev="${tags[$((i + 1))]:-}"; break; fi
          done

          version="${tag#v}"
          date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt[:10]')
          gh release view "$tag" --json assets --jq '[.assets[] | {name, size}]' > "$RUNNER_TEMP/assets.json"

          exists=false
          [ -f "site/articles/$version.ru.md" ] && exists=true

          echo "Release $tag (previous: ${prev:-none}), published $date, article exists: $exists"
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "prev=$prev"
            echo "version=$version"
            echo "date=$date"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      - name: Write the article
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.exists == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          CHROME: google-chrome
        run: |
          python3 .github/scripts/release_article.py \
            --version "${{ steps.rel.outputs.version }}" \
            --tag "${{ steps.rel.outputs.tag }}" \
            --prev-tag "${{ steps.rel.outputs.prev }}" \
            --date "${{ steps.rel.outputs.date }}" \
            --assets "$RUNNER_TEMP/assets.json" \
            --announce-out "$RUNNER_TEMP/announce.json"

      - name: Commit to main
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -q -m "feat(site): add the ${{ steps.rel.outputs.version }} article" \
            -m "Written by .github/workflows/release-article.yml for ${{ steps.rel.outputs.tag }}."
          # main may have moved while the model was writing.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --quiet origin main
          done
          echo "::error::Could not push the article to main."
          exit 1

      - name: Deploy the site
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.exists == 'false'
        run: |
          set -euo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --workflow pages.yml --branch main --event workflow_dispatch \
              --limit 5 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")][0].databaseId // empty")
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::The Pages deploy did not start."
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 20 > /dev/null

      - name: Prepare the announcement
        id: post
        if: >-
          steps.rel.outputs.skip == 'false' &&
          ((github.event_name == 'workflow_run' && steps.rel.outputs.exists == 'false') ||
           (github.event_name == 'workflow_dispatch' && inputs.post))
        env:
          LANGS: ${{ vars.RELEASE_POST_LANG || 'ru' }}
        run: |
          set -euo pipefail
          announce="$RUNNER_TEMP/announce.json"
          if [ ! -f "$announce" ]; then
            python3 .github/scripts/release_article.py --announce-only \
              --version "${{ steps.rel.outputs.version }}" --tag "${{ steps.rel.outputs.tag }}" \
              --announce-out "$announce"
          fi
          case "$LANGS" in
            en)   langs='["en"]' ;;
            both) langs='["ru","en"]' ;;
            *)    langs='["ru"]' ;;
          esac
          # One paragraph per language: the lead, then the link. The link's
          # preview card (title, cover) is the rest of the post.
          jq -r --argjson langs "$langs" '
            [ $langs[] as $l | .lead[$l] ] | join("\n\n")' "$announce" > "$RUNNER_TEMP/lead.txt"
          jq -r '.url' "$announce" > "$RUNNER_TEMP/url.txt"
          jq -r '.version' "$announce" > "$RUNNER_TEMP/version.txt"

      - name: Post to Telegram
        if: steps.post.outcome == 'success'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::TG_BOT_TOKEN / TG_CHAT_ID are not set, Telegram skipped."
            exit 0
          fi
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' "$1"; }
          url=$(cat "$RUNNER_TEMP/url.txt")
          text="<b>Glaze $(cat "$RUNNER_TEMP/version.txt")</b>"$'\n\n'"$(esc "$RUNNER_TEMP/lead.txt")"$'\n\n'"$url"
          payload=$(jq -n --arg cid "$TG_CHAT_ID" --arg tid "${TG_TOPIC_ID:-}" --arg text "$text" --arg url "$url" \
            '{chat_id: $cid, text: $text, parse_mode: "HTML",
              link_preview_options: {url: $url, prefer_large_media: true, show_above_text: false}}
             + (if $tid == "" then {} else {message_thread_id: ($tid | tonumber)} end)')
          res=$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' -d "$payload")
          if [ "$(jq -r '.ok' <<<"$res")" != "true" ]; then
            echo "::error::Telegram: $(jq -r '.description // "unknown error"' <<<"$res")"
            exit 1
          fi
          echo "Posted to Telegram."

      - name: Post to Discord
        if: steps.post.outcome == 'success'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK is not set, Discord skipped."
            exit 0
          fi
          content="**Glaze $(cat "$RUNNER_TEMP/version.txt")**"$'\n\n'"$(cat "$RUNNER_TEMP/lead.txt")"$'\n\n'"$(cat "$RUNNER_TEMP/url.txt")"
          payload=$(jq -n --arg c "$content" '{content: $c, username: "Glaze", allowed_mentions: {parse: []}}')
          code=$(curl -sS -o "$RUNNER_TEMP/discord.txt" -w '%{http_code}' -X POST "$WEBHOOK?wait=true" \
            -H 'Content-Type: application/json' -d "$payload")
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::Discord answered $code: $(cat "$RUNNER_TEMP/discord.txt")"
            exit 1
          fi
          echo "Posted to Discord."
