<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Glaze VN3D</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0f17; --panel: rgba(18, 19, 32, .9); --line: #2b2f48;
      --fg: #eceaf6; --muted: #9b99b8; --accent: #b9a6ff; --gold: #f1c56e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #stage { position: fixed; inset: 0; touch-action: none; overflow: hidden; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; font-size: 12px; }
    .chip { background: rgba(14, 15, 23, .72); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
    .chip b { color: var(--fg); font-weight: 500; }
    .chip.flag { color: var(--gold); border-color: rgba(241, 197, 110, .4); }
    #reticle { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
      background: rgba(255, 255, 255, .7); box-shadow: 0 0 0 2px rgba(0, 0, 0, .25); pointer-events: none; transition: transform .15s, background .15s; }
    #reticle.hot { transform: scale(2.4); background: var(--accent); }
    #focus { position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); pointer-events: none;
      background: rgba(14, 15, 23, .8); border: 1px solid rgba(185, 166, 255, .5); color: var(--fg); border-radius: 10px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
    #help { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); pointer-events: none;
      color: var(--muted); font-size: 12px; white-space: nowrap; opacity: .8; }
    body:not([data-mode="roam"]) #help, body:not([data-mode="roam"]) #reticle { display: none; }
    #dlg { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 820px; margin: 0 auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; min-height: 92px; }
    #who { position: absolute; top: -13px; left: 16px; font-weight: 600; font-size: 12px; letter-spacing: .06em; padding: 4px 12px; border-radius: 8px; color: #17132b; background: var(--gold); }
    #line { font-size: 17px; line-height: 1.5; min-height: 1.5em; }
    #line:empty { display: none; }
    #line.narr { font-style: italic; color: #d6d3ea; }
    #more { position: absolute; right: 16px; bottom: 10px; color: var(--accent); font-size: 12px; }
    #choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    #choices:empty { display: none; }
    #choices button, #restart { font: inherit; color: var(--fg); text-align: left; background: #1d2033; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
    #toast { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); background: #2a1d22; color: #ff9d8a; border: 1px solid #5a3138;
      border-radius: 10px; padding: 6px 12px; font-size: 13px; max-width: 90%; pointer-events: none; }
    #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; }
    #fade.on { opacity: 1; }
    #endcard { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; background: rgba(8, 8, 14, .78); }
    #endTitle { font-size: 28px; font-weight: 700; letter-spacing: .08em; }
    #restart { text-align: center; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { #fade, #reticle { transition: none; } }
  </style>
</head>
<body data-mode="idle">
  <div id="stage">
    <div class="hud"><span class="chip"><b id="sceneName">—</b></span><span id="flags" style="display:contents"></span></div>
    <div id="reticle"></div>
    <div id="focus" hidden></div>
    <div id="help"></div>
    <div id="dlg" hidden>
      <div id="who" hidden></div>
      <div id="line"></div>
      <div id="choices"></div>
      <div id="more" hidden>▼</div>
    </div>
    <div id="toast" hidden></div>
    <div id="fade"></div>
    <div id="endcard" hidden><div id="endTitle"></div><button id="restart" type="button"></button></div>
  </div>
  <!--VN3D_THREE-->
  <!--VN3D_ENGINE-->
</body>
</html>
