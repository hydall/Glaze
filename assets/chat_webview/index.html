<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- `interactive-widget=resizes-content`: the soft keyboard resizes the
       layout viewport instead of panning it. With the pan (the default), the
       embedder scrolls the whole page to reveal a focused caret and every
       `position: fixed` layer — the Flutter-glass strips included — slides out
       from under the Flutter chrome. Resizing keeps the visual viewport
       anchored, so the page's only scroll is #chat-container. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Glaze Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* The page itself never scrolls: #chat-container is the only scroller.
       `position: fixed` gives the document no scroll range at all, so the
       browser cannot answer a caret/selection reveal by scrolling the page
       (which carried the fixed overlay-blur strips away from the Flutter
       chrome); the reveal is forced onto the container instead, where
       `scroll-padding` keeps it clear of the chrome. */
    html, body { background: transparent;
      color: var(--text-color, #e0e0e0);
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif);
      font-size: var(--font-size, 15px);
      letter-spacing: var(--letter-spacing, 0);
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #chat-container {
      /* `dvh`, not `vh`: the soft keyboard shrinks the *visual* viewport while
         `100vh` keeps reporting the full screen by definition. The bridge
         derives the chat's bottom padding from how much of Flutter's inset the
         viewport already absorbed, measured as a shrink of this element
         (_viewportShrinkPx in bridge/chat_bridge_controller.js) - and with
         `100vh` that shrink is always zero, so the keyboard was counted twice:
         once as screen the reader can no longer see, once as padding. `vh`
         stays as the fallback for engines without `dvh`. */
      width: 100%; height: 100vh; height: 100dvh;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0;
      background: transparent;
    }
    #chat-container::-webkit-scrollbar {
      display: none;
      width: 0;
    }
    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }
    #loading-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; z-index: 9999;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #loading-screen .app-loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary-color, #7996ce);
      border-radius: 50%;
      animation: loaderSpin 0.8s linear infinite;
    }
    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading-screen"><div class="app-loader-spinner"></div></div>
  <div id="chat-container" class="layout-default"></div>

  <script type="module" src="formatter/index.js"></script>
  <script src="RollingNumber.js"></script>
  <script type="module" src="renderer/index.js"></script>
  <script src="useVirtualScroll.js"></script>
  <script src="glaze_sdk.js"></script>
  <script type="module" src="bridge/index.js"></script>
</body>
</html>
